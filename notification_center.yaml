version: 1
alerts:
  - id: low_water
    name: Water fountain needs filling
    enabled: true
    trigger:
      state_changed: true
      interval: true
    interval:
      hours: 12
    condition: >
      {{ is_state('sensor.pixi_smart_drinking_fountain_water_level', 'low') }}
    notifications:
      - action: notify.mobile_app_your_phone
        target: {}
        data:
          title: Water fountain needs filling
          message: The water level is low.

  - id: freezer_open
    name: Freezer has been open
    enabled: true
    trigger:
      state_changed: true
      interval: true
    interval:
      minutes: 10
    condition: >
      {{ is_state('binary_sensor.door_sensor_2_contact', 'on') and
         (now() - states.binary_sensor.door_sensor_2_contact.last_changed).total_seconds() >= 600 }}
    notifications:
      - action: notify.mobile_app_your_phone
        target: {}
        data:
          title: Warning
          message: The freezer has been open for 10 minutes.
          confirmation_button: Activity completed
          completion_message: Freezer closed.
