      enabled: false
      actions: []
      buttons: [{id: Hanterat, label: Hanterat}]
      notification:
        enabled: true
        message: 'Fixat av {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: false
        forget_after_enabled: false
        interval: 1800
        max_attempts: 5
        show_attempts: false
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        interval: 43200
        periodic: false
        startup: true
        items:
          - condition: or
            conditions:
              - condition: state
                entity_id: switch.pixi_smart_drinking_fountain_power
                for: {minutes: 5}
