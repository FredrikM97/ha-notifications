    notification:
      title: Frys ej stängd
      message: Freezer door has been open for 10 minutes.
      target: {label_id: [phone]}
      options: {alert_once: false, persistent: true, sticky: true}
    confirmation:
      enabled: false
      actions: []
      buttons: [{id: confirm, label: Done}]
      notification:
        enabled: true
        message: 'Fixed by {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: true
        forget_after_enabled: false
        interval: 300
        max_attempts: 5
        show_attempts: true
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions: {enabled: true, interval: 43200, items: [], periodic: false, startup: false}
      inactive:
        clear_notification: false
        enabled: true
        items:
          - trigger: state
            entity_id: binary_sensor.door_sensor_2_contact
            to: 'off'
      triggers:
        enabled: true
        items:
          - trigger: state
            entity_id: binary_sensor.door_sensor_2_contact
            for: '00:10:00'
            to: 'on'
  - id: alert_1789595836572
