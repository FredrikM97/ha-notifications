version: 1
alerts:
  - id: low_water
    name: Kattfontän lågt vatten
    description: ''
    enabled: true
    icon: mdi:water-alert
    created_at: '2026-09-13T18:10:02.616907+00:00'
    updated_at: '2026-09-25T07:22:27.000892+00:00'
    notification:
      title: Water level low
      message: Pixi Smart Drinking Fountain water level is low.
      target: {label_id: [phone]}
      options: {persistent: true, sticky: true}
    confirmation:
      enabled: true
      actions: []
      buttons: [{id: confirm, label: Done}]
      notification:
        enabled: true
        message: 'Confirmed {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: true
        forget_after_enabled: false
        interval: 43200
        max_attempts: 5
        show_attempts: true
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        interval: 43200
        periodic: false
        startup: true
        items:
          - condition: or
            conditions:
              - condition: state
                entity_id: sensor.pixi_smart_drinking_fountain_water_level
                for: {hours: 0, minutes: 5, seconds: 0}
                state: low
              - condition: state
                entity_id: sensor.pixi_smart_drinking_fountain_water_level
                for: {hours: 0, minutes: 5, seconds: 0}
                state: level_2
      inactive: {clear_notification: false, enabled: false, items: []}
      triggers:
        enabled: true
        items:
          - trigger: state
            entity_id: [sensor.pixi_smart_drinking_fountain_water_level]
            for: {hours: 0, minutes: 5, seconds: 0}
            to: [low, level_2]
  - id: byta_vatten
    name: Byta vatten på Kattfontänen
    description: ''
    enabled: true
    icon: mdi:water-sync
    created_at: '2026-09-13T18:22:41.592731+00:00'
    updated_at: '2026-09-15T20:37:03.118567+00:00'
    notification:
      title: Byta vatten
      message: Pixi Smart Drinking Fountain filter duration is above 29.
      target: {label_id: [phone]}
      options: {persistent: true, sticky: true}
    confirmation:
      enabled: true
      actions:
        - action: switch.turn_on
          data: {}
          metadata: {}
          target:
            entity_id:
              - switch.pixi_smart_drinking_fountain_water_pump_reset
              - switch.pixi_smart_drinking_fountain_filter_reset
      buttons: [{id: confirm, label: Done}]
      notification:
        enabled: true
        message: 'Confirmed by {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: true
        forget_after_enabled: false
        interval: 43200
        max_attempts: 5
        show_attempts: true
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        interval: 43200
        periodic: false
        startup: true
        items:
          - condition: numeric_state
            entity_id: sensor.pixi_smart_drinking_fountain_filter_duration
            above: 29
      inactive: {clear_notification: false, enabled: false, items: []}
      triggers:
        enabled: true
        items:
          - trigger: numeric_state
            entity_id: sensor.pixi_smart_drinking_fountain_filter_duration
            above: 29
  - id: maui_mat_tom
    name: Maui mat tom
    description: ''
    enabled: true
    icon: mdi:food-drumstick-off
    created_at: '2026-09-13T18:22:50.513920+00:00'
    updated_at: '2026-09-24T20:15:55.678901+00:00'
    notification:
      title: Maui mat tom
      message: ''
      target: {label_id: [phone]}
      options: {persistent: true, sticky: true}
    confirmation:
      enabled: true
      actions: []
      buttons: [{id: confirm, label: Done}]
      notification:
        enabled: true
        message: 'Food filled by {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: true
        forget_after_enabled: false
        interval: 43200
        max_attempts: 5
        show_attempts: true
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        interval: 43200
        periodic: true
        startup: true
        items:
          - condition: numeric_state
            entity_id: sensor.maui_matlada_fill_percent_2
            below: 20
      inactive: {clear_notification: false, enabled: false, items: []}
      triggers:
        enabled: true
        items:
          - trigger: numeric_state
            entity_id: sensor.maui_matlada_fill_percent_2
            below: 20
            for: '00:20:00'
  - id: battery_low
    name: Battery low detection
    description: ''
    enabled: false
    icon: mdi:battery-alert
    created_at: '2026-09-13T18:22:58.074400+00:00'
    updated_at: '2026-09-13T18:22:58.074400+00:00'
    notification:
      title: Battery low
      message: One or more battery sensors are below 20%.
      target: {label_id: [phone]}
    confirmation:
      enabled: true
      actions: []
      buttons: [{id: confirm, label: Done}]
      notification: {enabled: false, message: ''}
      reminders: {enabled: true, interval: 0, max_attempts: 5}
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        periodic: false
        startup: true
        items:
          - condition: template
            value_template: |
              {% set threshold = 20 %}
              {{ states.sensor
                | selectattr('attributes.device_class', 'eq', 'battery')
                | selectattr('state', 'is_number')
                | map(attribute='state')
                | map('int', 100)
                | select('lt', threshold)
                | list
                | count > 0 }}
      inactive: {clear_notification: false, enabled: false, items: []}
      triggers: {enabled: true, items: []}
  - id: jordmatare_fuktniva
    name: Jordmätare fuktnivå
    description: ''
    enabled: true
    icon: mdi:sprout
    created_at: '2026-09-13T18:23:04.389615+00:00'
    updated_at: '2026-09-15T20:36:17.115996+00:00'
    notification:
      title: Jordmätare fuktnivå
      message: One or more soil moisture sensors are below 20%.
      target: {label_id: [phone]}
      options: {persistent: true, sticky: true}
    confirmation:
      enabled: true
      actions: []
      buttons: [{id: confirm, label: Done}]
      notification:
        enabled: true
        message: 'Confirmed by {{ confirmed_by }}'
        target: {label_id: [phone]}
      reminders:
        enabled: true
        forget_after_enabled: false
        interval: 43200
        max_attempts: 5
        show_attempts: true
        timeout: 900
    monitor:
      automation_mode: parallel
      conditions:
        enabled: true
        interval: 43200
        periodic: false
        startup: true
        items:
          - condition: template
            value_template: >-
              {% set threshold = 20 %} {% set ns = namespace(low=false) %} {%
              for dev_id in label_devices('jordmätare') %}
                {% for entity_id in device_entities(dev_id) | select('match', '.*moisture.*') %}
                  {% if states(entity_id) not in ['unknown', 'unavailable']
                        and states(entity_id) | int(100) < threshold %}
                    {% set ns.low = true %}
                  {% endif %}
                {% endfor %}
              {% endfor %} {{ ns.low }}
      inactive: {clear_notification: false, enabled: false, items: []}
      triggers:
        enabled: true
        items:
          - trigger: template
            value_template: >-
              {% set threshold = 20 %} {% set ns = namespace(low=false) %} {%
              for dev_id in label_devices('jordmätare') %}
                {% for entity_id in device_entities(dev_id) | select('match', '.*moisture.*') %}
                  {% if states(entity_id) not in ['unknown', 'unavailable']
                        and states(entity_id) | int(100) < threshold %}
                    {% set ns.low = true %}
                  {% endif %}
                {% endfor %}
              {% endfor %} {{ ns.low }}
  - id: frys_ej_stangd
