id: ha_notifications_full_feature
alias: 'HA Notifications: Full feature'
description: Generated by HA Notifications. Do not edit manually.
initial_state: true
mode: parallel
triggers:
- trigger: homeassistant
  event: start
  id: '0'
- trigger: state
  entity_id: binary_sensor.door
  id: '1'
- trigger: state
  entity_id: binary_sensor.window
  id: '2'
- trigger: state
  entity_id: sensor.temperature
  id: '3'
conditions:
- condition: or
  conditions:
  - condition: and
    conditions:
    - condition: and
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.door
          state: 'on'
        - condition: numeric_state
          entity_id: sensor.temperature
          above: 30
      - condition: state
        entity_id: binary_sensor.window
        state: 'on'
    - condition: or
      conditions:
      - condition: trigger
        id:
        - '0'
        - '1'
        - '2'
        - '3'
      - condition: template
        value_template: '{{ trigger is not defined or trigger.platform is none }}'
  - condition: and
    conditions:
    - condition: trigger
      id:
      - '0'
      - '1'
      - '2'
      - '3'
    - condition: not
      conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.door
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.temperature
            above: 30
        - condition: state
          entity_id: binary_sensor.window
          state: 'on'
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - '0'
      - '1'
      - '2'
      - '3'
    - condition: not
      conditions:
      - condition: and
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.door
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.temperature
            above: 30
        - condition: state
          entity_id: binary_sensor.window
          state: 'on'
    sequence:
    - action: ha_notifications.report
      data:
        alert_id: full_feature
        alert_name: Full feature
        flow_id: '{{ context.id }}'
        status: inactive
        message: Condition inactive
        details:
          action: automation_inactive
  - conditions:
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: and
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.door
              state: 'on'
            - condition: numeric_state
              entity_id: sensor.temperature
              above: 30
          - condition: state
            entity_id: binary_sensor.window
            state: 'on'
        - condition: or
          conditions:
          - condition: trigger
            id:
            - '0'
            - '1'
            - '2'
            - '3'
          - condition: template
            value_template: '{{ trigger is not defined or trigger.platform is none
              }}'
      - condition: template
        value_template: '{{ trigger is not defined or trigger.platform is none }}'
    sequence:
    - action: ha_notifications.report
      data:
        alert_id: full_feature
        alert_name: Full feature
        flow_id: '{{ context.parent_id or context.id }}'
        status: started
        run_id: '{{ context.parent_id or context.id }}'
        details:
          action: automation_started
          started_by:
            platform: '{{ trigger.platform if trigger is defined and trigger.platform
              is defined else '''' }}'
            id: '{{ trigger.id if trigger is defined and trigger.id is defined else
              '''' }}'
            description: '{{ (trigger | default({})).description | default('''', true)
              }}'
            entity_id: '{{ trigger.entity_id if trigger is defined and trigger.entity_id
              is defined else '''' }}'
            from_state: '{{ trigger.from_state.state if trigger is defined and trigger.from_state
              is defined and trigger.from_state else '''' }}'
            to_state: '{{ trigger.to_state.state if trigger is defined and trigger.to_state
              is defined and trigger.to_state else '''' }}'
            event_type: '{{ trigger.event.event_type if trigger is defined and trigger.platform
              == ''event'' and trigger.event is defined and trigger.event else ''''
              }}'
    - action: ha_notifications.send
      data:
        alert_id: full_feature
        alert_name: Full feature
        flow_id: '{{ context.parent_id or context.id }}'
        use_default_tag: true
        payload:
          title: ''
          message: Door open
          data:
            actions:
            - action: ha_notifications_full_feature_confirmation_confirm
              title: Confirm
        action: notify.mobile_app_phone
        target:
          entity_id:
          - notify.mobile_app_phone
    - action: logbook.log
      data:
        name: Full feature sent
    - action: ha_notifications.report
      data:
        alert_id: full_feature
        alert_name: Full feature
        flow_id: '{{ context.parent_id or context.id }}'
        status: action_executed
        run_id: '{{ context.parent_id or context.id }}'
        message: Automation action executed
        details:
          action: logbook.log
    - action: ha_notifications.report
      data:
        alert_id: full_feature
        alert_name: Full feature
        flow_id: '{{ context.parent_id or context.id }}'
        status: waiting
        run_id: '{{ context.parent_id or context.id }}'
        message: Waiting for confirmation
        details:
          action: confirmation_waiting
    - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        id: confirmation
        event_data:
          action: ha_notifications_full_feature_confirmation_confirm
      - trigger: event
        event_type: ha_notifications_command
        id: cancel_run
        event_data:
          alert_id: full_feature
          command: cancel_run
      - trigger: event
        event_type: ha_notifications_command
        id: skip_confirmation
        event_data:
          alert_id: full_feature
          command: skip_confirmation
      timeout:
        minutes: 15
      continue_on_timeout: true
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ wait.trigger.id == ''confirmation'' }}'
        sequence:
        - action: ha_notifications.report
          data:
            alert_id: full_feature
            alert_name: Full feature
            flow_id: '{{ context.parent_id or context.id }}'
            status: confirmation_completed
            run_id: '{{ context.parent_id or context.id }}'
            message: Confirmation completed
            details:
              action: confirmation_completed
              device_id: '{{ wait.trigger.event.data.device_id | default('''', true)
                }}'
              user_id: '{{ wait.trigger.event.context.user_id | default('''', true)
                }}'
        - action: ha_notifications.send
          data:
            alert_id: full_feature
            alert_name: Full feature
            flow_id: '{{ context.parent_id or context.id }}'
            use_default_tag: true
            payload:
              title: ''
              message: '{% raw %}Confirmed{% endraw %}'
              data: {}
            action: notify.mobile_app_phone
            confirmation:
              device_id: '{{ wait.trigger.event.data.device_id | default('''', true)
                }}'
              user_id: '{{ wait.trigger.event.context.user_id | default('''', true)
                }}'
            history_reason: confirmation_notification
        - action: light.turn_on
          target:
            entity_id: light.hall
        - action: ha_notifications.report
          data:
            alert_id: full_feature
            alert_name: Full feature
            flow_id: '{{ context.parent_id or context.id }}'
            status: action_executed
            run_id: '{{ context.parent_id or context.id }}'
            message: Automation action executed
            details:
              action: light.turn_on
        - stop: confirmation completed
      - conditions:
        - condition: template
          value_template: '{{ wait.trigger.id == ''cancel_run'' }}'
        sequence:
        - action: ha_notifications.report
          data:
            alert_id: full_feature
            alert_name: Full feature
            flow_id: '{{ context.parent_id or context.id }}'
            status: cancelled
            run_id: '{{ context.parent_id or context.id }}'
            message: Automation run cancelled
            details:
              action: confirmation_cancelled
        - stop: Confirmation ended
      default:
      - repeat:
          count: 5
          sequence:
          - action: ha_notifications.send
            data:
              alert_id: full_feature
              alert_name: Full feature
              flow_id: '{{ context.parent_id or context.id }}'
              use_default_tag: true
              payload:
                title: Attempt {{ repeat.index + 1 }}/5
                message: Door open
                data:
                  actions:
                  - action: ha_notifications_full_feature_confirmation_confirm
                    title: Confirm
              action: notify.mobile_app_phone
              target:
                entity_id:
                - notify.mobile_app_phone
          - action: ha_notifications.report
            data:
              alert_id: full_feature
              alert_name: Full feature
              flow_id: '{{ context.parent_id or context.id }}'
              status: confirmation_reminder
              message: Confirmation reminder sent
              details:
                action: confirmation_reminder
                repeat: '{{ repeat.index }}'
          - action: ha_notifications.report
            data:
              alert_id: full_feature
              alert_name: Full feature
              flow_id: '{{ context.parent_id or context.id }}'
              status: waiting
              run_id: '{{ context.parent_id or context.id }}'
              message: Waiting for confirmation
              details:
                action: confirmation_waiting
          - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              id: confirmation
              event_data:
                action: ha_notifications_full_feature_confirmation_confirm
            - trigger: event
              event_type: ha_notifications_command
              id: cancel_run
              event_data:
                alert_id: full_feature
                command: cancel_run
            - trigger: event
              event_type: ha_notifications_command
              id: skip_confirmation
              event_data:
                alert_id: full_feature
                command: skip_confirmation
            timeout:
              minutes: 15
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger.id == ''confirmation'' }}'
              sequence:
              - action: ha_notifications.report
                data:
                  alert_id: full_feature
                  alert_name: Full feature
                  flow_id: '{{ context.parent_id or context.id }}'
                  status: confirmation_completed
                  run_id: '{{ context.parent_id or context.id }}'
                  message: Confirmation completed
                  details:
                    action: confirmation_completed
                    device_id: '{{ wait.trigger.event.data.device_id | default('''',
                      true) }}'
                    user_id: '{{ wait.trigger.event.context.user_id | default('''',
                      true) }}'
              - action: ha_notifications.send
                data:
                  alert_id: full_feature
                  alert_name: Full feature
                  flow_id: '{{ context.parent_id or context.id }}'
                  use_default_tag: true
                  payload:
                    title: ''
                    message: '{% raw %}Confirmed{% endraw %}'
                    data: {}
                  action: notify.mobile_app_phone
                  confirmation:
                    device_id: '{{ wait.trigger.event.data.device_id | default('''',
                      true) }}'
                    user_id: '{{ wait.trigger.event.context.user_id | default('''',
                      true) }}'
                  history_reason: confirmation_notification
              - action: light.turn_on
                target:
                  entity_id: light.hall
              - action: ha_notifications.report
                data:
                  alert_id: full_feature
                  alert_name: Full feature
                  flow_id: '{{ context.parent_id or context.id }}'
                  status: action_executed
                  run_id: '{{ context.parent_id or context.id }}'
                  message: Automation action executed
                  details:
                    action: light.turn_on
              - stop: confirmation completed
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger.id == ''cancel_run'' }}'
              sequence:
              - action: ha_notifications.report
                data:
                  alert_id: full_feature
                  alert_name: Full feature
                  flow_id: '{{ context.parent_id or context.id }}'
                  status: cancelled
                  run_id: '{{ context.parent_id or context.id }}'
                  message: Automation run cancelled
                  details:
                    action: confirmation_cancelled
              - stop: Confirmation ended
            default: []
      - action: ha_notifications.report
        data:
          alert_id: full_feature
          alert_name: Full feature
          flow_id: '{{ context.parent_id or context.id }}'
          status: confirmation_timeout
          run_id: '{{ context.parent_id or context.id }}'
          message: Confirmation timed out
          details:
            action: confirmation_timeout
      - stop: Confirmation ended
  default: []
