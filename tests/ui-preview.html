<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HA Notifications UI Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111318;
        color: #e8eaed;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }

      ha-notifications-card {
        display: block;
        max-width: 1180px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <ha-notifications-card></ha-notifications-card>
    <script type="module">
      import "/build/panel.js";

      const alert = {
        id: "front_door",
        name: "Front door open",
        description: "Notify when the front door stays open.",
        icon: "mdi:door-open",
        enabled: true,
        conditions: [
          {
            type: "state",
            id: "front_door",
            entity_id: "binary_sensor.front_door",
            state: "on",
            for: "00:05:00",
          },
        ],
        monitor: {
          on_change: true,
          startup: true,
          interval: "01:00:00",
          retention: { enabled: true, days: 14 },
        },
        notification: {
          target: { entity_id: ["notify.phone"] },
          title: "Front door",
          message: "The front door is still open.",
        },
      };

      const history = [
        {
          id: "event-1",
          timestamp: "2026-09-21T08:42:00Z",
          alert_id: alert.id,
          alert_name: alert.name,
          type: "notification_sent",
          message: "Notification sent.",
          details: { action: "notify.mobile_app_phone" },
        },
        {
          id: "event-2",
          timestamp: "2026-09-21T08:37:00Z",
          alert_id: alert.id,
          alert_name: alert.name,
          type: "condition_active",
          message: "Condition became true.",
          details: { source: "state" },
        },
      ];

      const registries = {
        entities: [
          {
            entity_id: "binary_sensor.front_door",
            name: "Front door",
            friendly_name: "Front door",
          },
          { entity_id: "notify.phone", name: "Phone" },
          { entity_id: "light.hall", name: "Hall light" },
        ],
        devices: [{ id: "device_phone", name: "Phone", name_by_user: "Main phone" }],
        areas: [{ area_id: "hall", name: "Hall" }],
        labels: [],
        floors: [],
        users: [{ id: "user_fred", name: "Fred", is_active: true }],
      };

      const responses = {
        "config/entity_registry/list": registries.entities,
        get_states: registries.entities.map((entity) => ({
          entity_id: entity.entity_id,
          attributes: { friendly_name: entity.friendly_name || entity.name },
        })),
        "config/device_registry/list": registries.devices,
        "config/area_registry/list": registries.areas,
        "config/label_registry/list": registries.labels,
        "config/floor_registry/list": registries.floors,
        "config/auth/list": registries.users,
        "ha_notifications/list": [alert],
        "ha_notifications/runtime": {
          [alert.id]: { active: true, confirmation_attempts: 2 },
        },
        "ha_notifications/history": history,
      };

      const hass = {
        user: { is_admin: true },
        locale: "en-US",
        connection: {
          sendMessagePromise: async ({ type }) => responses[type] ?? {},
        },
      };

      document.querySelector("ha-notifications-card").hass = hass;
    </script>
  </body>
</html>
