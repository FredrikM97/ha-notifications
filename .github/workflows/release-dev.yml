name: Dev Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  release:
    if: github.repository_owner == 'FredrikM97'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether main has changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(git rev-parse --short HEAD)
          previous_notes=$(gh release view dev --json body --jq '.body' 2>/dev/null || true)
          if printf '%s' "$previous_notes" | grep -Fq "**Commit**: $current_sha"; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.create == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build HACS package
        if: steps.changes.outputs.create == 'true'
        run: |
          npm ci
          npm run export:hacs
          cd hacs-export/custom_components/ha_notifications
          zip -r ../../../ha-notifications.zip . -x '*.pyc' '*__pycache__/*'

      - name: Update dev tag and prerelease
        if: steps.changes.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev
          git push -f origin dev
          last_stable=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$last_stable" ]; then
            commit_count=$(git rev-list --count "$last_stable"..HEAD)
          else
            commit_count="N/A"
          fi
          notes="Development build from main branch."$'\n\n'"**Build**: $(date -u '+%Y-%m-%d %H:%M UTC')"$'\n'"**Commit**: $(git rev-parse --short HEAD)"$'\n'"**Changes**: $commit_count commits since the last stable release"
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --title "Dev Release" --notes "$notes" --prerelease
          fi
          gh release upload dev ha-notifications.zip --clobber
          gh release edit dev --notes "$notes" --prerelease
