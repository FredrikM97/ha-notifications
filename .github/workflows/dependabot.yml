name: Dependabot auto-approve

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'FredrikM97/ha-notifications'

    steps:
      - name: Wait for checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          max_wait=1800
          interval=15
          elapsed=0

          while [ "$elapsed" -lt "$max_wait" ]; do
            checks=$(gh api \
              "/repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100")

            total=$(echo "$checks" | jq '
              [
                .check_runs[]
                | select(.name != "Dependabot auto-approve")
              ] | length
            ')

            pending=$(echo "$checks" | jq '
              [
                .check_runs[]
                | select(.name != "Dependabot auto-approve")
                | select(.conclusion == null)
              ] | length
            ')

            failed=$(echo "$checks" | jq '
              [
                .check_runs[]
                | select(.name != "Dependabot auto-approve")
                | select(.conclusion != null)
                | select(
                    .conclusion != "success" and
                    .conclusion != "neutral" and
                    .conclusion != "skipped"
                  )
              ] | length
            ')

            echo "Checks: $total total, $pending pending, $failed failed"

            echo "$checks" | jq -r '
              .check_runs[]
              | select(.name != "Dependabot auto-approve")
              | "\(.name): \(.conclusion // "pending")"
            '

            if [ "$failed" -gt 0 ]; then
              echo "One or more checks failed."
              exit 1
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All checks have completed successfully."
              exit 0
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "Timed out after 30 minutes waiting for checks."
          exit 1

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --auto
