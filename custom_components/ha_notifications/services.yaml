report:
  name: Report automation state
  description: Record an automation lifecycle or action event and optional metadata.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that owns the reported event.
      required: true
      selector:
        text:
    alert_name:
      name: Alert name
      description: Display name of the alert.
      required: false
      selector:
        text:
    status:
      name: Status
      description: Lifecycle or action event being reported, such as action_executed.
      required: true
      selector:
        text:
    run_id:
      name: Run ID
      description: Required for started, waiting, running, and completed states.
      required: false
      selector:
        text:
    message:
      name: Message
      description: Optional human-readable report message.
      required: false
      selector:
        text:
    details:
      name: Details
      description: Optional structured report metadata.
      required: false
      selector:
        object:
send:
  name: Send notification
  description: Send a notification using HA Notifications.
  fields:
    use_default_tag:
      name: Use alert ID as default tag
      description: Defaults to true. Add alert_id as the tag only when payload.data.tag is absent. Disable for separate notifications; custom tags are always preserved. Android persistent notifications require a tag.
      default: true
      selector:
        boolean:
    payload:
      name: Payload
      description: Native notify service payload with title, message, and data containing device options.
      required: true
      selector:
        object:
    target:
      name: Recipients
      selector:
        object:
    action:
      name: Notify action
      selector:
        text:
    alert_id:
      name: Alert ID
      selector:
        text:
    alert_name:
      name: Alert name
      selector:
        text:
    flow_id:
      name: Flow ID
      selector:
        text:
    confirmation:
      name: Confirmation context
      selector:
        object:
    history_reason:
      name: History reason
      selector:
        text:

clear:
  name: Clear notification
  description: Clear a notification using its configured Home Assistant action. Requires a tag matching the earlier push; without a default or custom tag, a previous push cannot be identified.
  fields:
    use_default_tag:
      name: Use alert ID as default tag
      description: Defaults to true. Use the same setting as the original send. A custom payload.data.tag is always preserved; disabling without a custom tag cannot identify a previous push.
      default: true
      selector:
        boolean:
    payload:
      name: Payload
      description: Native notify payload; data contains device options and an optional custom tag. Message is replaced with clear_notification.
      required: true
      selector:
        object:
    target:
      name: Recipients
      selector:
        object:
    action:
      name: Notify action
      selector:
        text:
    alert_id:
      name: Alert ID
      selector:
        text:
    alert_name:
      name: Alert name
      selector:
        text:
    flow_id:
      name: Flow ID
      selector:
        text:
    confirmation:
      name: Confirmation context
      selector:
        object:
    history_reason:
      name: History reason
      selector:
        text:

command:
  name: Send alert command
  description: Send an alert-scoped command event to HA Notifications automations.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that receives the command.
      required: true
      selector:
        text:
    command:
      name: Command
      description: Command to send, such as skip_confirmation.
      required: true
      selector:
        text:
