report:
  name: Report automation state
  description: Record an automation lifecycle or action event and optional metadata.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that owns the reported event.
      required: true
      selector:
        text:
    alert_name:
      name: Alert name
      description: Display name of the alert.
      required: false
      selector:
        text:
    status:
      name: Status
      description: Lifecycle or action event being reported, such as action_executed.
      required: true
      selector:
        text:
    run_id:
      name: Run ID
      description: Required for started, waiting, running, and completed states.
      required: false
      selector:
        text:
    message:
      name: Message
      description: Optional human-readable report message.
      required: false
      selector:
        text:
    details:
      name: Details
      description: Optional structured report metadata.
      required: false
      selector:
        object:
    cancel_on_inactive:
      name: Cancel on inactive
      description: Emit a command to cancel confirmation waits after an inactive transition.
      required: false
      selector:
        boolean:

send:
  name: Send notification
  description: Send a notification using HA Notifications.
  fields:
    target:
      name: Target
      description: Optional Home Assistant target.
      required: false
      selector:
        target:

    data:
      name: Data
      description: Notification data.
      required: false
      selector:
        object:

clear:
  name: Clear notification
  description: Clear a notification using its configured Home Assistant action.
  fields:
    action:
      name: Action
      description: Home Assistant action used to deliver the notification.
      required: true
      selector:
        text:

    target:
      name: Target
      description: Optional Home Assistant target.
      required: false
      selector:
        target:

    data:
      name: Data
      description: Notification data.
      required: false
      selector:
        object:

command:
  name: Send alert command
  description: Send an alert-scoped command event to HA Notifications automations.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that receives the command.
      required: true
      selector:
        text:
    command:
      name: Command
      description: Command to send, such as skip_confirmation.
      required: true
      selector:
        text:
