record:
  name: Record automation action
  description: Record a successful automation action in HA Notifications history.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that owns the automation action.
      required: true
      selector:
        text:
    alert_name:
      name: Alert name
      description: Display name of the alert.
      required: false
      selector:
        text:
    event_type:
      name: Event type
      description: Optional history event type.
      required: false
      selector:
        text:
    message:
      name: Message
      description: Optional history event message.
      required: false
      selector:
        text:
    details:
      name: Details
      description: Optional structured action details.
      required: false
      selector:
        object:

report:
  name: Report automation state
  description: Record an automation lifecycle state and optional metadata.
  fields:
    alert_id:
      name: Alert ID
      description: Alert that owns the reported state.
      required: true
      selector:
        text:
    alert_name:
      name: Alert name
      description: Display name of the alert.
      required: false
      selector:
        text:
    status:
      name: Status
      description: Lifecycle or domain-specific state being reported.
      required: true
      selector:
        text:
    run_id:
      name: Run ID
      description: Required for started, waiting, running, and completed states.
      required: false
      selector:
        text:
    message:
      name: Message
      description: Optional human-readable report message.
      required: false
      selector:
        text:
    details:
      name: Details
      description: Optional structured report metadata.
      required: false
      selector:
        object:

send:
  name: Send notification
  description: Send a notification using HA Notifications.
  fields:
    target:
      name: Target
      description: Optional Home Assistant target.
      required: false
      selector:
        target:

    data:
      name: Data
      description: Notification data.
      required: false
      selector:
        object:

clear:
  name: Clear notification
  description: Clear a notification using its configured Home Assistant action.
  fields:
    action:
      name: Action
      description: Home Assistant action used to deliver the notification.
      required: true
      selector:
        text:

    target:
      name: Target
      description: Optional Home Assistant target.
      required: false
      selector:
        target:

    data:
      name: Data
      description: Notification data.
      required: false
      selector:
        object:
