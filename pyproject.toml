[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-notifications"
version = "0.4.0"
description = "Home Assistant HA Notifications custom integration"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "voluptuous>=0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "homeassistant>=2025.1",
    "home-assistant-frontend==20250109.2",
    "pytest-homeassistant-custom-component==0.13.205",
    "syrupy==4.8.0",
]
quality = [
    "ruff>=0.8",
]
all = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "homeassistant>=2025.1",
    "home-assistant-frontend==20250109.2",
    "pytest-homeassistant-custom-component==0.13.205",
    "syrupy==4.8.0",
    "ruff>=0.8",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.ha_notifications*"]

[tool.setuptools.package-data]
custom_components.ha_notifications = ["manifest.json", "services.yaml", "strings.json", "translations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:.*pyOpenSSL.*deprecated.*:DeprecationWarning:josepy\..*',
    "ignore:.*Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant.components.http",
    'ignore:.*pyOpenSSL.*deprecated.*:DeprecationWarning:acme\..*',
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]