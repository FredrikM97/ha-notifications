[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-notifications"
version = "0.4.0"
description = "Home Assistant HA Notifications custom integration"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"
dependencies = [
    "pydantic",
    "voluptuous==0.16.0",
]

[project.optional-dependencies]
all = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "homeassistant==2026.10.0",
    "home-assistant-frontend==20260930.0",
    "syrupy==6.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.ha_notifications*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 160
exclude = [
    ".git",
    ".venv",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
