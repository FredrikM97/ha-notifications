[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-notifications"
version = "0.4.0"
description = "Home Assistant HA Notifications custom integration"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"
dependencies = [
    "pydantic==2.13.4",
    "voluptuous==0.16.0",
]

[project.optional-dependencies]
all = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "homeassistant==2026.9.3",
    "home-assistant-frontend==20260826.7",
    "pytest-homeassistant-custom-component==0.13.366",
    "syrupy==6.0.0",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.ha_notifications*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:.*pyOpenSSL.*deprecated.*:DeprecationWarning:josepy\..*',
    "ignore:.*Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant.components.http",
    'ignore:.*pyOpenSSL.*deprecated.*:DeprecationWarning:acme\..*',
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "build",
    "__pycache__",
]
[tool.ruff.lint]
select = ["E", "F", "I"]