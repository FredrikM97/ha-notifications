[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-notifications"
version = "0.4.0"
description = "Home Assistant HA Notifications custom integration"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"
dependencies = [
    "pydantic",
    "voluptuous==0.16.0",
]

[project.optional-dependencies]
all = [
    "pytest-homeassistant==2026.11.0",
    "home-assistant-frontend==20261028.5",
    "syrupy==6.1.1",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.ha_notifications*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-ra -p no:respx"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
