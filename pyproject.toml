[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-center-custom-integration"
version = "0.4.0"
description = "Home Assistant Notification Center custom integration"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "voluptuous>=0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "homeassistant>=2025.1",
]
quality = [
    "ruff>=0.8",
]
all = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "homeassistant>=2025.1",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]